name: PRM fixed-feature CPU head diagnostic

on:
  pull_request:
    paths:
      - 'scripts/prm_cpu_head_diagnostic.py'
      - 'tests/test_prm_cpu_head_diagnostic.py'
      - '.github/workflows/prm-cpu-head-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-feature-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only scientific dependencies
        run: |
          python -m pip install numpy==2.1.3
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Execute CPU numerical contracts
        run: python -m unittest discover -s tests -p 'test_prm_cpu_head_diagnostic.py' -v
      - name: Download immutable-hash checked supplemental evidence
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 \
            'https://github.com/Zqqq-qq/webshop-stepwise-rl/releases/download/data-v1/prm-evidence-supplement-20261124.zip' \
            --output /tmp/prm-evidence-supplement-20261124.zip
      - name: Run PyTorch FP32 LR sweep and head-only batch comparison
        run: |
          python scripts/prm_cpu_head_diagnostic.py \
            --archive /tmp/prm-evidence-supplement-20261124.zip \
            --output artifacts/prm-cpu-head/results.json
      - name: Upload replayable eight-sample predictions and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prm-cpu-head-diagnostic
          path: artifacts/prm-cpu-head/results.json
          if-no-files-found: warn
